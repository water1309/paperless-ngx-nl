name: Build and Push paperless-ngx-nl

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest paperless-ngx release tag
        id: upstream_release
        run: |
          TAG=$(curl -s https://api.github.com/repos/paperless-ngx/paperless-ngx/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get previously built tag
        id: previous_tag
        run: |
          TAG=$(cat .last_built_tag 2>/dev/null || echo "none")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Build and push if new release
        if: steps.upstream_release.outputs.tag != steps.previous_tag.outputs.tag
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/water1309/paperless-ngx-nl:latest
            ghcr.io/water1309/paperless-ngx-nl:${{ steps.upstream_release.outputs.tag }}

      - name: Save built tag
        if: steps.upstream_release.outputs.tag != steps.previous_tag.outputs.tag
        run: |
          echo "${{ steps.upstream_release.outputs.tag }}" > .last_built_tag
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .last_built_tag
          git commit -m "Built paperless-ngx ${{ steps.upstream_release.outputs.tag }}"
          git push
